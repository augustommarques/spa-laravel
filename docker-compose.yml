services:
  # Serviço MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: spa-laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spa-laravel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Serviço PHP 8.2 com Composer e Node.js
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: spa-laravel-php
    restart: unless-stopped
    user: "${UID:-33}:${GID:-33}"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spa-laravel-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Serviço Nginx
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: spa-laravel-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - spa-laravel-network

volumes:
  mysql_data:
    driver: local

networks:
  spa-laravel-network:
    driver: bridge

